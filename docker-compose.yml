services:
  postgres:
    image: postgres:16-alpine
    container_name: iserv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iserv
      POSTGRES_USER: iserv
      POSTGRES_PASSWORD: iserv
    ports:
      - "5432:5432"
    volumes:
      - iserv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iserv -d iserv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iserv-postgres-data:
