services:
  - type: web
    name: iserv-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: iserv-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://iserv-l1ji.onrender.com

  - type: web
    name: iserv-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://iserv-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Landing Page pública (Experiência do Cliente Final) — Soma Contabilidade.
  # Site estático puro (HTML/CSS/JS), sem build step. As URLs de API/painel
  # em produção já estão fixadas em sites/soma-contabilidade/assets/site.js
  # (PRODUCTION_API_URL / PRODUCTION_PAINEL_URL).
  - type: web
    name: iserv-site-soma-contabilidade
    env: static
    rootDir: sites/soma-contabilidade
    buildCommand: "echo 'Site estático, sem build necessário.'"
    staticPublishPath: .

databases:
  - name: iserv-db
    databaseName: iserv
    user: iserv
    plan: free
